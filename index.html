<style>
  /* Simple scrollbar styling for a better UX */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #9CA3AF; border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
  .dark ::-webkit-scrollbar-thumb { background: #4B5563; }
  ::-webkit-scrollbar-thumb:hover { background: #6B7280; }
  .dark ::-webkit-scrollbar-thumb:hover { background: #374151; }

  /* Custom dark scrollbar for Gantt chart */
  .gantt-scrollbar::-webkit-scrollbar { height: 14px; }
  .gantt-scrollbar::-webkit-scrollbar-track { background: #e0e0e0; border-radius: 10px; }
  .gantt-scrollbar::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 10px; border: 2px solid #e0e0e0; }
  .gantt-scrollbar::-webkit-scrollbar-thumb:hover { background: #1a202c; }
  .dark .gantt-scrollbar::-webkit-scrollbar-track { background: #2d3748; }
  .dark .gantt-scrollbar::-webkit-scrollbar-thumb { background: #4a5568; border-color: #2d3748;}
  .dark .gantt-scrollbar::-webkit-scrollbar-thumb:hover { background: #718096; }

  /* Style for weekend cells in Gantt chart - VISIBLE HATCHING */
  .weekend-cell {
    background-image: repeating-linear-gradient(
      45deg,
      #E5E7EB, /* using light-border color for light mode */
      #E5E7EB 1px,
      transparent 1px,
      transparent 5px
    );
  }
  .dark .weekend-cell {
    background-image: repeating-linear-gradient(
      45deg,
      #374151, /* using dark-border color for dark mode */
      #374151 1px,
      transparent 1px,
      transparent 5px
    );
  }

  /* Style for holiday cells - transparent red background */
  .holiday-cell {
    background-color: rgba(239, 68, 68, 0.15); /* bg-red-500/15 */
  }
  .dark .holiday-cell {
    background-color: rgba(239, 68, 68, 0.25); /* bg-red-500/25 for better contrast */
  }
</style>
